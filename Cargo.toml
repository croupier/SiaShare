[workspace]
resolver = "2"
members = [
    "crates/sia-core",
    "apps/uploader-desktop/src-tauri",
    "apps/receiver-micro/src-tauri",
]

[workspace.dependencies]
# Официальный Rust SDK Sia Storage. Ветка 0.13.x — API, под который написан проект.
sia_storage = "0.13"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
# ZIP64 (large_file) нужен для файлов >4 ГиБ; async_zip не используем.
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
hex = "0.4"
walkdir = "2"
tempfile = "3"
# buffer_unordered для параллельных share/pin (лимит одновременных запросов).
futures = "0.3"
# Per-chunk хэш содержимого: сквозная проверка целостности поверх Merkle-пруфов SDK.
blake3 = "1"
# Системный keychain: AppKey нельзя хранить plaintext-файлом.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# Скорость в приоритете для uploader: горячий код (erasure coding, сеть) внутри
# sia_storage и зависимостей, поэтому opt-level=3 на весь release-профиль.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = 3
strip = true

# Переносимый receiver-micro распространяется внутри каждой раздачи — ему
# критичен размер, а не скорость: точечный override обратно на "z".
[profile.release.package.receiver-micro]
opt-level = "z"
